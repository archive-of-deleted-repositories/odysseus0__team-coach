name: Generate Team Digest

on:
  # Daily schedule - Every day at 12:00 UTC
  schedule:
    - cron: '0 12 * * *'
  
  # Manual trigger with optional parameters
  workflow_dispatch:
    inputs:
      start_days_ago:
        description: 'Number of days ago to start (default: 1)'
        required: false
        default: '1'
      skip_upload:
        description: 'Skip Google Drive upload (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_notify:
        description: 'Skip Telegram notification (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Restrict permissions
permissions:
  contents: read
  actions: write

jobs:
  generate-digest:
    name: Generate Team Digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # Install uv with built-in caching
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      # Get current week for weekly cache refresh
      - name: Get current week
        id: date
        run: echo "week=$(date +'%Y-W%U')" >> $GITHUB_OUTPUT
      
      # Cache rclone (weekly refresh)
      - name: Cache rclone
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/rclone
          key: rclone-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: |
            rclone-${{ runner.os }}-
      
      # Cache Claude CLI (weekly refresh)
      - name: Cache Claude CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: claude-cli-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: |
            claude-cli-${{ runner.os }}-
      
      - name: Install rclone
        run: |
          if [ ! -f /usr/local/bin/rclone ]; then
            echo "Installing rclone (cache miss)..."
            curl https://rclone.org/install.sh | sudo bash
          else
            echo "Using cached rclone"
          fi
          rclone version
      
      - name: Install Dependencies
        run: uv sync
      
      - name: Setup Google Drive Service Account
        run: |
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_B64 }}' | base64 -d > service-account.json
          chmod 600 service-account.json
      
      # Export Telegram data
      - name: Export Telegram Messages
        env:
          SYNAPSE_TELEGRAM__API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SYNAPSE_TELEGRAM__API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SYNAPSE_TELEGRAM__SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          START_DATE=$(date -d "${{ github.event.inputs.start_days_ago || '1' }} days ago" +%Y-%m-%d)
          uv run synapse-pipeline export-telegram \
            --start "$START_DATE" \
            --end "$(date +%Y-%m-%d)" \
            --output ./telegram_exports
      
      # Download Google Drive data
      - name: Download Team Data from Google Drive
        run: |
          uv run synapse-pipeline download-gdrive \
            ./gdrive_data \
            --since-days ${{ github.event.inputs.start_days_ago || '1' }}
      
      # Transform Telegram data to markdown
      - name: Transform Telegram Data
        run: |
          uv run synapse-pipeline batch-transform \
            ./telegram_exports \
            --output ./transformed_data
      
      # Install Claude CLI
      - name: Install Claude CLI
        run: |
          if ! command -v claude &> /dev/null; then
            echo "Installing Claude CLI (cache miss)..."
            npm install -g @anthropic-ai/claude-code
          else
            echo "Using cached Claude CLI"
          fi
          claude --version
          
      # Generate digest using Claude CLI
      - name: Generate Team Digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Create a clean workspace for digest generation
          mkdir -p digest_workspace
          cp -r ./transformed_data/* digest_workspace/
          cp -r ./gdrive_data/* digest_workspace/ 2>/dev/null || true
          cd digest_workspace
          
          # Debug: Show what files Claude will process
          echo "Files in digest workspace:"
          ls -la
          
          # Generate filename with today's date
          DIGEST_DATE=$(date +%Y-%m-%d)
          DIGEST_FILE="digest_${DIGEST_DATE}.md"
          
          # Run Claude with the agent prompt to write the digest
          claude --model sonnet -p "Execute the provided instructions and write the complete digest to a file named '$DIGEST_FILE'" \
            --allowedTools "LS" "Read" "Write" < ../demo_agentic_newsletter/newsletter_agent_prompt.md
          
          # Verify output was created
          if [ ! -f "$DIGEST_FILE" ] || [ ! -s "$DIGEST_FILE" ]; then
            echo "::error::Newsletter generation failed - no output file created or file is empty"
            exit 1
          fi
          
          echo "::notice::Team digest generated successfully: $DIGEST_FILE"
      
      - name: Prepare Outputs
        run: |
          mkdir -p outputs
          DIGEST_DATE=$(date +%Y-%m-%d)
          DIGEST_FILE="digest_${DIGEST_DATE}.md"
          cp "digest_workspace/$DIGEST_FILE" "outputs/$DIGEST_FILE"
          
          # Create metadata file
          cat > outputs/metadata.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "date_range": "${{ github.event.inputs.start_days_ago || '7' }} days",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.event_name }}",
            "telegram_channels_exported": "from config.toml",
            "gdrive_data_downloaded": true
          }
          EOF
      
      # Upload artifacts to GitHub
      - name: Upload Digest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: team-digest-${{ github.run_id }}
          path: outputs/
          retention-days: 30
      
      # Upload to Google Drive
      - name: Upload to Google Drive
        id: gdrive_upload
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: |
          DIGEST_FILE="outputs/digest_$(date +%Y-%m-%d).md"
          SHARE_LINK=$(uv run synapse-pipeline upload-digest "$DIGEST_FILE" | grep "Share link:" | cut -d' ' -f3)
          echo "gdrive_url=$SHARE_LINK" >> $GITHUB_OUTPUT
      
      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ github.event.inputs.skip_notify != 'true' && github.event.inputs.skip_upload != 'true' }}
        env:
          SYNAPSE_TELEGRAM_NOTIFIER__BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          DIGEST_FILE="outputs/digest_$(date +%Y-%m-%d).md"
          
          # Read the full digest content
          DIGEST_CONTENT=$(cat "$DIGEST_FILE")
          
          # Send the full digest with markdown formatting
          uv run synapse-pipeline notify "$DIGEST_CONTENT"
      
      - name: Workflow Summary
        run: |
          echo "## Team Digest Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated at**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Date range**: Last ${{ github.event.inputs.start_days_ago || '1' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: Full Pipeline (Telegram + Google Drive)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Telegram data exported" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Google Drive data downloaded" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Data transformed to markdown" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Digest generated with Claude" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.inputs.skip_upload }}" != "true" ]]; then
            echo "- ✅ Uploaded to Google Drive: ${{ steps.gdrive_upload.outputs.gdrive_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ github.event.inputs.skip_notify }}" != "true" ]] && [[ "${{ github.event.inputs.skip_upload }}" != "true" ]]; then
            echo "- ✅ Telegram notification sent" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The generated digest is available as an artifact in this workflow run." >> $GITHUB_STEP_SUMMARY

