name: Generate Team Digest

on:
  # Daily schedule - Every day at 12:00 UTC
  schedule:
    - cron: '0 12 * * *'
  
  # Manual trigger with optional parameters
  workflow_dispatch:
    inputs:
      start_days_ago:
        description: 'Number of days ago to start (default: 1)'
        required: false
        default: '1'
      skip_upload:
        description: 'Skip Google Drive upload (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_notify:
        description: 'Skip Telegram notification (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Restrict permissions
permissions:
  contents: read
  actions: write

jobs:
  # Job 1: Export Telegram Data (Parallel)
  export-telegram:
    name: Export Telegram Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      telegram-status: ${{ steps.export-status.outputs.status }}
      message-count: ${{ steps.export-status.outputs.count }}
      date-range: ${{ steps.export-status.outputs.date-range }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup uv Environment
        uses: ./.github/actions/setup-uv-env
      
      # Export Telegram data
      - name: Export Telegram Messages
        env:
          SYNAPSE_TELEGRAM__API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SYNAPSE_TELEGRAM__API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SYNAPSE_TELEGRAM__SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          START_DATE=$(date -d "${{ github.event.inputs.start_days_ago || '1' }} days ago" +%Y-%m-%d)
          uv run synapse-pipeline export-telegram \
            --start "$START_DATE" \
            --end "$(date +%Y-%m-%d)" \
            --output ./telegram_exports
          
          # Count exported messages for metadata
          MESSAGE_COUNT=$(find ./telegram_exports -name "*.json" -exec wc -l {} + | tail -1 | awk '{print $1}' || echo "0")
          echo "Exported $MESSAGE_COUNT messages from Telegram"
      
      - name: Upload Telegram Exports
        uses: actions/upload-artifact@v4
        with:
          name: telegram-exports-${{ github.run_id }}
          path: telegram_exports/
          retention-days: 7
          compression-level: 6
      
      - name: Set Export Status
        id: export-status
        run: |
          MESSAGE_COUNT=$(find ./telegram_exports -name "*.json" -exec wc -l {} + | tail -1 | awk '{print $1}' || echo "0")
          echo "status=success" >> $GITHUB_OUTPUT
          echo "count=$MESSAGE_COUNT" >> $GITHUB_OUTPUT
          echo "date-range=${{ github.event.inputs.start_days_ago || '1' }}" >> $GITHUB_OUTPUT

  # Job 2: Export Google Drive Data (Parallel with Telegram)
  export-gdrive:
    name: Export Google Drive Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gdrive-status: ${{ steps.export-status.outputs.status }}
      file-count: ${{ steps.export-status.outputs.count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup uv Environment
        uses: ./.github/actions/setup-uv-env
      
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version
      
      - name: Setup Google Drive Service Account
        run: |
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_B64 }}' | base64 -d > service-account.json
          chmod 600 service-account.json
      
      # Download Google Drive data
      - name: Download Team Data from Google Drive
        run: |
          uv run synapse-pipeline download-gdrive \
            ./gdrive_data \
            --since-days ${{ github.event.inputs.start_days_ago || '1' }}
          
          # Count downloaded files for metadata
          FILE_COUNT=$(find ./gdrive_data -type f | wc -l || echo "0")
          echo "Downloaded $FILE_COUNT files from Google Drive"
      
      - name: Upload Google Drive Data
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-data-${{ github.run_id }}
          path: gdrive_data/
          retention-days: 7
          compression-level: 6
      
      - name: Set Export Status
        id: export-status
        run: |
          FILE_COUNT=$(find ./gdrive_data -type f | wc -l || echo "0")
          echo "status=success" >> $GITHUB_OUTPUT
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT

  # Job 3: Transform Data (Depends only on Telegram - Early Start!)
  transform-data:
    name: Transform Data to Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: export-telegram
    if: needs.export-telegram.outputs.telegram-status == 'success'
    outputs:
      transform-status: ${{ steps.transform-status.outputs.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup uv Environment
        uses: ./.github/actions/setup-uv-env
      
      - name: Download Telegram Exports
        uses: actions/download-artifact@v4
        with:
          name: telegram-exports-${{ github.run_id }}
          path: telegram_exports/
      
      # Transform Telegram data to markdown
      - name: Transform Telegram Data
        run: |
          uv run synapse-pipeline batch-transform \
            ./telegram_exports \
            --output ./transformed_data
          
          echo "Transformed $(find ./transformed_data -name "*.md" | wc -l) markdown files"
      
      - name: Upload Transformed Data
        uses: actions/upload-artifact@v4
        with:
          name: transformed-data-${{ github.run_id }}
          path: transformed_data/
          retention-days: 7
          compression-level: 6
      
      - name: Set Transform Status
        id: transform-status
        run: |
          echo "status=success" >> $GITHUB_OUTPUT

  # Job 4: Generate Digest (Depends on both Transform and GDrive)
  generate-digest:
    name: Generate Team Digest with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [transform-data, export-gdrive]
    if: needs.transform-data.outputs.transform-status == 'success' && needs.export-gdrive.outputs.gdrive-status == 'success'
    outputs:
      digest-status: ${{ steps.digest-status.outputs.status }}
      digest-filename: ${{ steps.digest-status.outputs.filename }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Claude CLI
        uses: ./.github/actions/setup-claude-cli
      
      - name: Download Transformed Data
        uses: actions/download-artifact@v4
        with:
          name: transformed-data-${{ github.run_id }}
          path: transformed_data/
      
      - name: Download Google Drive Data
        uses: actions/download-artifact@v4
        with:
          name: gdrive-data-${{ github.run_id }}
          path: gdrive_data/
      
      
      # Generate digest using Claude CLI
      - name: Generate Team Digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Create a clean workspace for digest generation
          mkdir -p digest_workspace
          cp -r ./transformed_data/* digest_workspace/
          cp -r ./gdrive_data/* digest_workspace/ 2>/dev/null || true
          cd digest_workspace
          
          # Debug: Show what files Claude will process
          echo "Files in digest workspace:"
          ls -la
          
          # Generate filename with today's date
          DIGEST_DATE=$(date +%Y-%m-%d)
          DIGEST_FILE="digest_${DIGEST_DATE}.md"
          
          # Run Claude with the agent prompt to write the digest
          claude --model sonnet -p "Execute the provided instructions and write the complete digest to a file named '$DIGEST_FILE'" \
            --allowedTools "LS" "Read" "Write" < ../demo_agentic_newsletter/newsletter_agent_prompt.md
          
          # Verify output was created
          if [ ! -f "$DIGEST_FILE" ] || [ ! -s "$DIGEST_FILE" ]; then
            echo "::error::Newsletter generation failed - no output file created or file is empty"
            exit 1
          fi
          
          echo "::notice::Team digest generated successfully: $DIGEST_FILE"
          
          # Prepare outputs
          mkdir -p ../outputs
          cp "$DIGEST_FILE" "../outputs/$DIGEST_FILE"
          
          # Create metadata file
          cat > ../outputs/metadata.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "date_range": "${{ needs.export-telegram.outputs.date-range }} days",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.event_name }}",
            "telegram_messages": "${{ needs.export-telegram.outputs.message-count }}",
            "gdrive_files": "${{ needs.export-gdrive.outputs.file-count }}"
          }
          EOF
      
      - name: Upload Digest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: team-digest-${{ github.run_id }}
          path: outputs/
          retention-days: 30
      
      - name: Set Digest Status
        id: digest-status
        run: |
          echo "status=success" >> $GITHUB_OUTPUT
          echo "filename=digest_$(date +%Y-%m-%d).md" >> $GITHUB_OUTPUT

  # Job 5: Upload to Google Drive (Parallel Distribution)
  upload-digest:
    name: Upload to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: generate-digest
    if: needs.generate-digest.outputs.digest-status == 'success' && github.event.inputs.skip_upload != 'true'
    outputs:
      gdrive-url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup uv Environment
        uses: ./.github/actions/setup-uv-env
      
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version
      
      - name: Setup Google Drive Service Account
        run: |
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_B64 }}' | base64 -d > service-account.json
          chmod 600 service-account.json
      
      - name: Download Digest
        uses: actions/download-artifact@v4
        with:
          name: team-digest-${{ github.run_id }}
          path: outputs/
      
      - name: Upload to Google Drive
        id: upload
        run: |
          DIGEST_FILE="outputs/${{ needs.generate-digest.outputs.digest-filename }}"
          SHARE_LINK=$(uv run synapse-pipeline upload-digest "$DIGEST_FILE" | grep "Share link:" | cut -d' ' -f3)
          echo "url=$SHARE_LINK" >> $GITHUB_OUTPUT
          echo "::notice::Uploaded to Google Drive: $SHARE_LINK"

  # Job 6: Send Telegram Notification (Parallel Distribution)
  notify-team:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: generate-digest
    if: needs.generate-digest.outputs.digest-status == 'success' && github.event.inputs.skip_notify != 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup uv Environment
        uses: ./.github/actions/setup-uv-env
      
      - name: Download Digest
        uses: actions/download-artifact@v4
        with:
          name: team-digest-${{ github.run_id }}
          path: outputs/
      
      - name: Send Telegram Notification
        env:
          SYNAPSE_TELEGRAM_NOTIFIER__BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          DIGEST_FILE="outputs/${{ needs.generate-digest.outputs.digest-filename }}"
          
          # Read the full digest content
          DIGEST_CONTENT=$(cat "$DIGEST_FILE")
          
          # Send the full digest with markdown formatting
          uv run synapse-pipeline notify "$DIGEST_CONTENT"
          echo "::notice::Telegram notification sent successfully"

  # Summary Job (Always runs to show results)
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [export-telegram, export-gdrive, transform-data, generate-digest, upload-digest, notify-team]
    steps:
      - name: Generate Workflow Summary
        run: |
          echo "## 🚀 Team Digest Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Job Status Overview" >> $GITHUB_STEP_SUMMARY
          echo "- **Telegram Export**: ${{ needs.export-telegram.result == 'success' && '✅' || '❌' }} ${{ needs.export-telegram.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Drive Export**: ${{ needs.export-gdrive.result == 'success' && '✅' || '❌' }} ${{ needs.export-gdrive.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Transform**: ${{ needs.transform-data.result == 'success' && '✅' || '❌' }} ${{ needs.transform-data.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest Generation**: ${{ needs.generate-digest.result == 'success' && '✅' || '❌' }} ${{ needs.generate-digest.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Drive Upload**: ${{ needs.upload-digest.result == 'success' && '✅' || needs.upload-digest.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.upload-digest.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Telegram Notification**: ${{ needs.notify-team.result == 'success' && '✅' || needs.notify-team.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.notify-team.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Data Processing Stats" >> $GITHUB_STEP_SUMMARY
          echo "- **Telegram Messages**: ${{ needs.export-telegram.outputs.message-count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Drive Files**: ${{ needs.export-gdrive.outputs.file-count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date Range**: Last ${{ needs.export-telegram.outputs.date-range || '1' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated at**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Results" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.upload-digest.outputs.gdrive-url }}" != "" ]]; then
            echo "- **Google Drive**: [${{ needs.upload-digest.outputs.gdrive-url }}](${{ needs.upload-digest.outputs.gdrive-url }})" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ github.event.inputs.skip_upload }}" == "true" ]]; then
            echo "- **Google Drive**: ⏭️ Skipped (testing mode)" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ github.event.inputs.skip_notify }}" == "true" ]]; then
            echo "- **Telegram**: ⏭️ Skipped (testing mode)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The generated digest is available as an artifact in this workflow run for 30 days." >> $GITHUB_STEP_SUMMARY